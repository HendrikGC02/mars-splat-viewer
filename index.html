<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Station Splat</title>
<style>
  :root { --fg: #f4e6d8; --bg: #120b08; --panel: rgba(20, 12, 8, 0.72); --accent: #e0814a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; }
  #hud { position: fixed; z-index: 10; left: 12px; top: 12px; background: var(--panel); padding: 10px 12px; border-radius: 8px; max-width: 360px; }
  #hud h1 { font-size: 15px; margin: 0 0 6px; color: var(--accent); }
  #hud p { margin: 4px 0; }
  #hud select, #hud button { background: #2a1a12; color: var(--fg); border: 1px solid #5a3a28; border-radius: 4px; padding: 3px 6px; }
  #status { opacity: 0.8; font-size: 12px; }
  kbd { background: #2a1a12; border: 1px solid #5a3a28; border-radius: 3px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<div id="hud">
  <h1>Mars — Perseverance station</h1>
  <p><select id="scene"></select> <button id="reset">Reset view</button> <button id="fs">Fullscreen</button></p>
  <p>Drag to look around · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>R</kbd>/<kbd>F</kbd> up/down · <kbd>Shift</kbd> faster · <kbd>H</kbd> hide panel · <kbd>B</kbd> cycle 3D · <kbd>E</kbd> enhanced detail</p>
  <p>3D <select id="stereo">
      <option value="off">Off</option>
      <option value="sbs">Side-by-side (L | R)</option>
      <option value="tb">Top-bottom (L over R)</option>
    </select>
    <label title="Frame-packed (half-resolution) stereo: each eye is squeezed into its half of the frame and the projector or 3D display stretches it back. Turn off if each eye should keep its natural shape, e.g. a full double-height frame."><input type="checkbox" id="squeeze"> squeeze</label></p>
  <p>eye sep <input type="range" id="ipd" min="0.02" max="0.5" step="0.01" value="0.065" style="width:90px; vertical-align:middle"> <span id="ipdv">6.5 cm</span></p>
  <p><label title="Optional post-process: local contrast (clarity), fine sharpening, mild vibrance and contrast. Off = calibrated colours, untouched."><input type="checkbox" id="enh"> Enhanced detail</label> · strength <input type="range" id="enhs" min="0" max="1" step="0.05" value="0.6" style="width:90px; vertical-align:middle"> <span id="enhv">60%</span></p>
  <p id="status">Loading…</p>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";
import { StereoRig } from "./stereo.js";

const status = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb59a7a);  // dusty Mars tone behind everything
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 20000);
scene.add(new SparkRenderer({ renderer }));

// Splats are trained in a Z-up world (x forward, y left, z up), origin = Mastcam-Z head.
// Rotate to three.js Y-up.
const world = new THREE.Group();
world.rotation.x = -Math.PI / 2;
scene.add(world);

const controls = new SparkControls({ canvas: renderer.domElement });
// Spark binds E/Q to up/down by default; E is the "Enhanced detail" toggle, so use R/F for up/down (as the HUD says).
{
  const m = controls.fpsMovement.keycodeMoveMapping;
  const up = m.KeyE, down = m.KeyQ;
  delete m.KeyE; delete m.KeyQ;
  if (up) m.KeyR = up;
  if (down) m.KeyF = down;
}
let splat = null;

// World (after the group rotation): three.js Y-up; the rover's forward direction is +X.
// Origin = Mastcam-Z head, ~2 m above the ground. Lower the eye to ~1.7 m for a standing person.
const EYE = new THREE.Vector3(0, -0.3, 0);
function resetView() {
  camera.position.copy(EYE);
  camera.lookAt(EYE.clone().add(new THREE.Vector3(1, -0.12, 0)));
}

async function loadScene(url) {
  status.textContent = `Loading ${url}…`;
  if (splat) { world.remove(splat); splat.dispose?.(); }
  splat = new SplatMesh({ url });
  world.add(splat);
  await splat.initialized;
  status.textContent = `${url} — ${splat.numSplats?.toLocaleString?.() ?? ""} splats`;
}

const scenes = await fetch("scenes.json").then(r => r.json()).catch(() => [{ name: "scene", url: "scene.ply" }]);
const sel = document.getElementById("scene");
for (const s of scenes) { const o = document.createElement("option"); o.value = s.url; o.textContent = s.name; sel.appendChild(o); }
sel.onchange = () => { resetView(); loadScene(sel.value); };
document.getElementById("reset").onclick = resetView;
addEventListener("keydown", e => { if (e.key === "h" || e.key === "H") { const h = document.getElementById("hud"); h.style.display = h.style.display === "none" ? "" : "none"; } });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

document.getElementById("fs").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.();
};

// Stereo for 3D displays: side-by-side (left eye on the left half) or top-bottom (left eye on the top
// half, as 3D projectors expect). "Squeeze" packs each eye's full-frame image into its half of the frame
// (anamorphic, half resolution) for displays that stretch it back; unsqueezed, each eye keeps the shape
// of its half. Eye separation is adjustable: 6.5 cm = human scale; larger values exaggerate depth for
// distant terrain. The eye cameras come from StereoRig rather than THREE.StereoCamera directly — see
// stereo.js for why.
//   URL overrides, e.g. for a theatre bookmark: ?stereo=tb (off|sbs|tb) &squeeze=0|1
const stereo = new StereoRig();
const stereoSel = document.getElementById("stereo"), squeeze = document.getElementById("squeeze");
const ipd = document.getElementById("ipd"), ipdv = document.getElementById("ipdv");
const STEREO_MODES = ["off", "sbs", "tb"];
const SQUEEZE_DEFAULT = { off: false, sbs: false, tb: true };
const STEREO_KEY = "marsViewer.stereo";
function stereoSave() {
  try { localStorage.setItem(STEREO_KEY, JSON.stringify({ mode: stereoSel.value, squeeze: squeeze.checked })); } catch (e) { /* ignore */ }
}
function setStereoMode(mode) {
  stereoSel.value = mode;
  squeeze.checked = SQUEEZE_DEFAULT[mode];
  squeeze.parentElement.style.display = mode === "off" ? "none" : "";
}
{
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STEREO_KEY) || "null"); } catch (e) { /* storage unavailable */ }
  const params = new URLSearchParams(location.search);
  const urlMode = params.get("stereo");
  const mode = STEREO_MODES.includes(urlMode) ? urlMode : STEREO_MODES.includes(saved?.mode) ? saved.mode : "off";
  setStereoMode(mode);
  if (params.has("squeeze")) squeeze.checked = params.get("squeeze") !== "0";
  else if (saved && saved.mode === mode && typeof saved.squeeze === "boolean") squeeze.checked = saved.squeeze;
}
stereoSel.onchange = () => { setStereoMode(stereoSel.value); stereoSave(); };
squeeze.onchange = stereoSave;
ipd.oninput = () => { ipdv.textContent = `${(ipd.value * 100).toFixed(1)} cm`; };
addEventListener("keydown", e => {
  if ((e.key === "b" || e.key === "B") && !e.ctrlKey && !e.metaKey && !e.altKey) {
    setStereoMode(STEREO_MODES[(STEREO_MODES.indexOf(stereoSel.value) + 1) % STEREO_MODES.length]);
    stereoSave();
  }
});
// Each eye's camera aspect as a multiple of the main camera's: squeezed, every eye renders the full-frame
// view; unsqueezed, it matches the shape of its half (half as wide, or twice as wide for top-bottom).
function eyeAspect() {
  if (squeeze.checked) return 1;
  return stereoSel.value === "tb" ? 2 : 0.5;
}
// Each eye's viewport [camera, x, y, w, h] on a W x H surface (WebGL origin is bottom-left, so the
// top-bottom layout puts the left eye in the upper half).
function eyeViewports(W, H) {
  if (stereoSel.value === "sbs") {
    const half = Math.floor(W / 2);
    return [[stereo.cameraL, 0, 0, half, H], [stereo.cameraR, half, 0, W - half, H]];
  }
  const lower = Math.floor(H / 2);
  return [[stereo.cameraL, 0, lower, W, H - lower], [stereo.cameraR, 0, 0, W, lower]];
}

// ---------------------------------------------------------------------------------------------
// Optional "Enhanced detail" post-process (off by default; when off the scene renders straight to
// the canvas exactly as before, with no extra pass or render target).
//   scene -> RT (full res) -> H blur of luminance (half res) -> V blur (half res) -> final pass to canvas
// The final pass adds back k*(L - blur(L)) (clarity, ~8 px Gaussian), a small 1 px unsharp term, then mild
// vibrance and a slight S-curve, all on display-referred (sRGB-encoded) values. Stereo modes render both
// eyes into the RT first; blur taps and sharpening are clamped to each eye's half so nothing bleeds across
// the seam.
// ---------------------------------------------------------------------------------------------
const enh = document.getElementById("enh"), enhs = document.getElementById("enhs"), enhv = document.getElementById("enhv");
const ENH_KEY = "marsViewer.enhance";
try {
  const saved = JSON.parse(localStorage.getItem(ENH_KEY) || "null");
  if (saved) {
    enh.checked = !!saved.on;
    if (Number.isFinite(saved.strength)) enhs.value = Math.min(1, Math.max(0, saved.strength));
  }
} catch (e) { /* storage unavailable: use defaults */ }
function enhSave() {
  try { localStorage.setItem(ENH_KEY, JSON.stringify({ on: enh.checked, strength: parseFloat(enhs.value) })); } catch (e) { /* ignore */ }
}
function enhLabel() { enhv.textContent = `${Math.round(enhs.value * 100)}%`; }
enhLabel();
enh.onchange = enhSave;
enhs.oninput = () => { enhLabel(); enhSave(); };
addEventListener("keydown", e => {
  if ((e.key === "e" || e.key === "E") && !e.ctrlKey && !e.metaKey && !e.altKey) { enh.checked = !enh.checked; enhSave(); }
});

const BLUR_SIGMA_PX = 8;  // clarity radius (Gaussian sigma) in CSS pixels
const FS_VERT = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const LAYOUT = { off: 0, sbs: 1, tb: 2 };  // uLayout values
const STEREO_GLSL = `
  uniform float uLayout;  // 0 = mono, 1 = side-by-side, 2 = top-bottom
  vec2 clampEye(vec2 p, vec2 centre, vec2 texel) {
    vec2 lo = vec2(0.0), hi = vec2(1.0);
    if (uLayout > 1.5) { if (centre.y < 0.5) hi.y = 0.5; else lo.y = 0.5; }
    else if (uLayout > 0.5) { if (centre.x < 0.5) hi.x = 0.5; else lo.x = 0.5; }
    return clamp(p, lo + 0.5 * texel, hi - 0.5 * texel);
  }
  float luma(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }`;
function blurMaterial(fromRGB) {
  return new THREE.ShaderMaterial({
    uniforms: { tSrc: { value: null }, uStep: { value: new THREE.Vector2() }, uSigma: { value: 8 }, uLayout: { value: 0 } },
    vertexShader: FS_VERT, depthTest: false, depthWrite: false,
    fragmentShader: `
      precision highp float; varying vec2 vUv; uniform sampler2D tSrc; uniform vec2 uStep; uniform float uSigma;
      ${STEREO_GLSL}
      void main() {
        // 13-tap Gaussian spanning +-2.5 sigma (bilinear filtering smooths between taps). uStep = texel size * direction.
        const int N = 6; float h = 2.5 * uSigma / float(N);
        float acc = 0.0, wsum = 0.0;
        for (int i = -N; i <= N; i++) {
          float o = float(i) * h;
          float w = exp(-0.5 * (o * o) / (uSigma * uSigma));
          vec4 t = texture2D(tSrc, clampEye(vUv + uStep * o, vUv, abs(uStep) + vec2(0.0)));
          acc += w * ${fromRGB ? "luma(t.rgb)" : "t.r"}; wsum += w;
        }
        gl_FragColor = vec4(acc / wsum, 0.0, 0.0, 1.0);
      }`,
  });
}
const enhMats = {
  blurH: blurMaterial(true),
  blurV: blurMaterial(false),
  final: new THREE.ShaderMaterial({
    uniforms: { tScene: { value: null }, tBlur: { value: null }, uTexel: { value: new THREE.Vector2() }, uStrength: { value: 0.6 }, uLayout: { value: 0 } },
    vertexShader: FS_VERT, depthTest: false, depthWrite: false,
    fragmentShader: `
      precision highp float; varying vec2 vUv; uniform sampler2D tScene, tBlur; uniform vec2 uTexel; uniform float uStrength;
      ${STEREO_GLSL}
      void main() {
        vec3 c = texture2D(tScene, vUv).rgb;
        float L = luma(c);
        // coarse local contrast: unsharp mask on luminance, radius ~8 px
        float dC = clamp(L - texture2D(tBlur, vUv).r, -0.2, 0.2);
        // fine sharpening: 1 px unsharp
        float nb = 0.25 * (luma(texture2D(tScene, clampEye(vUv + vec2(uTexel.x, 0.0), vUv, uTexel)).rgb)
                         + luma(texture2D(tScene, clampEye(vUv - vec2(uTexel.x, 0.0), vUv, uTexel)).rgb)
                         + luma(texture2D(tScene, clampEye(vUv + vec2(0.0, uTexel.y), vUv, uTexel)).rgb)
                         + luma(texture2D(tScene, clampEye(vUv - vec2(0.0, uTexel.y), vUv, uTexel)).rgb));
        float dF = clamp(L - nb, -0.1, 0.1);
        c += uStrength * (0.9 * dC + 0.5 * dF);
        c = clamp(c, 0.0, 1.0);
        // vibrance: boost low-saturation pixels more than saturated ones
        float sat = max(c.r, max(c.g, c.b)) - min(c.r, min(c.g, c.b));
        c = clamp(mix(vec3(luma(c)), c, 1.0 + 0.45 * uStrength * (1.0 - sat)), 0.0, 1.0);
        // slight S-curve
        c = mix(c, c * c * (3.0 - 2.0 * c), 0.3 * uStrength);
        gl_FragColor = vec4(c, 1.0);
      }`,
  }),
};
const fsTri = new THREE.Mesh(new THREE.BufferGeometry(), enhMats.final);
fsTri.geometry.setAttribute("position", new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
fsTri.geometry.setAttribute("uv", new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
fsTri.frustumCulled = false;
const fsScene = new THREE.Scene(); fsScene.add(fsTri);
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// The scene render target must behave like the canvas: Spark and three.js both decide whether to output
// linear or sRGB-encoded colour from the target. Flagging it as an "XR render target" tagged sRGB makes both
// write display-referred values with no hardware sRGB encode, so blending and colours match the canvas path.
let rtScene = null, rtA = null, rtB = null;
function enhTargets() {
  const size = renderer.getDrawingBufferSize(new THREE.Vector2());
  const W = Math.max(2, size.x), H = Math.max(2, size.y);
  if (rtScene && rtScene.width === W && rtScene.height === H) return;
  rtScene?.dispose(); rtA?.dispose(); rtB?.dispose();
  const mk = (w, h, type, depth) => new THREE.WebGLRenderTarget(w, h, { type, depthBuffer: depth, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  rtScene = mk(W, H, THREE.UnsignedByteType, true);
  rtScene.isXRRenderTarget = true;
  rtScene.texture.colorSpace = THREE.SRGBColorSpace;
  rtA = mk(Math.ceil(W / 2), Math.ceil(H / 2), THREE.HalfFloatType, false);
  rtB = mk(Math.ceil(W / 2), Math.ceil(H / 2), THREE.HalfFloatType, false);
}
function fsPass(mat, target) {
  fsTri.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(fsScene, fsCam);
}
// Render mono or stereo into the effect's render target (pixel units, not CSS px).
function renderToTarget(rt) {
  const W = rt.width, H = rt.height;
  if (stereoSel.value === "off") {
    rt.scissorTest = false; rt.viewport.set(0, 0, W, H);
    renderer.setRenderTarget(rt);  // viewport/scissor are latched when the target is (re)set
    renderer.render(scene, camera);
    return;
  }
  stereo.update(camera, parseFloat(ipd.value), eyeAspect());
  rt.scissorTest = true;
  for (const [eye, x, y, w, h] of eyeViewports(W, H)) {
    rt.scissor.set(x, y, w, h); rt.viewport.set(x, y, w, h);
    renderer.setRenderTarget(rt);  // viewport/scissor are latched when the target is (re)set
    renderer.render(scene, eye);
  }
  rt.scissorTest = false;
}

resetView();
loadScene(scenes[0].url);
renderer.setAnimationLoop(() => {
  controls.update(camera);
  const strength = parseFloat(enhs.value);
  if (enh.checked && strength > 0) {
    enhTargets();
    const W = rtScene.width, H = rtScene.height, layout = LAYOUT[stereoSel.value];
    renderToTarget(rtScene);
    const sigma = BLUR_SIGMA_PX * (W / innerWidth);  // device pixels at full resolution
    // A squeezed eye is compressed 2x along the split axis; shrink the blur the same way so the clarity
    // radius is round again once the display stretches it back.
    const squeezed = layout !== 0 && squeeze.checked;
    const sx = squeezed && layout === LAYOUT.sbs ? 0.5 : 1, sy = squeezed && layout === LAYOUT.tb ? 0.5 : 1;
    const { blurH, blurV, final } = enhMats;
    blurH.uniforms.tSrc.value = rtScene.texture; blurH.uniforms.uStep.value.set(1 / W, 0);
    blurH.uniforms.uSigma.value = sigma * sx; blurH.uniforms.uLayout.value = layout;
    fsPass(blurH, rtA);
    blurV.uniforms.tSrc.value = rtA.texture; blurV.uniforms.uStep.value.set(0, 1 / rtA.height);
    blurV.uniforms.uSigma.value = sigma / 2 * sy; blurV.uniforms.uLayout.value = layout;
    fsPass(blurV, rtB);
    final.uniforms.tScene.value = rtScene.texture; final.uniforms.tBlur.value = rtB.texture;
    final.uniforms.uTexel.value.set(1 / W, 1 / H); final.uniforms.uStrength.value = strength; final.uniforms.uLayout.value = layout;
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    fsPass(final, null);
    return;
  }
  // Effect off: the original direct-to-canvas path, unchanged.
  renderer.setRenderTarget(null);
  if (stereoSel.value === "off") {
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, innerWidth, innerHeight);
    renderer.render(scene, camera);
    return;
  }
  stereo.update(camera, parseFloat(ipd.value), eyeAspect());
  renderer.setScissorTest(true);
  for (const [eye, x, y, w, h] of eyeViewports(innerWidth, innerHeight)) {
    renderer.setScissor(x, y, w, h); renderer.setViewport(x, y, w, h);
    renderer.render(scene, eye);
  }
});
</script>
</body>
</html>
